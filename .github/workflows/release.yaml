name: "Package and release gems with precompiled binaries"
on:
  workflow_dispatch:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

# Mirrors the consumer workflow under review. The release job declares the
# environment, holds id-token: write, stores no registry credential, and reaches the shared
# composite action in another repository at a mutable branch ref. Note that the other two
# action references in this job are SHA-pinned and this one is not, which is the upstream shape.

jobs:
  release:
    environment: release
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 5
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    name: "Release all gems"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Setup Ruby"
        uses: ruby/setup-ruby@bec3f19a76460dbe12f60def7d1a77585f07516c # v1.322.0
        with:
          ruby-version: "3.3"
      - name: "Run the build action"
        uses: "timhaines/release-action-fixture-rubygems/.github/actions/build-release@main"
        with:
          step: "release"
          publish: "true"
          gem-name: "release-integrity-fixture"
          gem-version: "${{ github.ref_name }}"
